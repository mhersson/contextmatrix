name: CI / Build and Push

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "config.yaml.example"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "config.yaml.example"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

# Only one run per ref. Superseded pull-request runs are cancelled so they stop
# occupying the two self-hosted runner slots; push and workflow_dispatch runs
# build and push an image, so they always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skipped on push and on a pull request that changes no Go code (see the
  # changes job); a skipped job satisfies the required check.
  go-checks:
    needs: [changes]
    if: |
      !cancelled() &&
      github.event_name != 'push' &&
      needs.changes.outputs.go != 'false'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The self-hosted runners share one persistent GOMODCACHE and GOCACHE
          # on the host, so the action's cache has nothing to add. Restoring it
          # tar-extracts a ~1.8 GiB blob over those live directories, which
          # corrupts modules when two Go jobs run concurrently, and the save
          # step re-tars ~8 GiB only to lose the key race with the other job.
          cache: false

      - name: Prepare web/dist placeholder for go:embed
        run: mkdir -p web/dist && touch web/dist/.gitkeep

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race -short
        run: go test -race -short ./...
        env:
          CGO_ENABLED: "1"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  # Answers two questions for pull requests against the base sha: did
  # anything under web/ change, and did any Go code change (a file outside
  # web/, or a .go file anywhere, which covers the embed file under web/)?
  # Nothing outside web/ feeds the frontend job and nothing but Go code and
  # go.mod feeds the Go jobs, so a pull request skips the jobs it cannot
  # affect. Any fetch or diff failure, or an empty diff, answers true to
  # both, so a job runs whenever there is doubt.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    outputs:
      web: ${{ steps.detect.outputs.web }}
      go: ${{ steps.detect.outputs.go }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed areas
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          web=true; go=true
          if git fetch --no-tags --depth=1 origin "$BASE_SHA" \
            && files=$(git diff --name-only "$BASE_SHA" HEAD) && [ -n "$files" ]; then
            web=false; go=false
            echo "$files" | grep -q '^web/' && web=true
            echo "$files" | grep -qv '^web/' && go=true
            echo "$files" | grep -q '\.go$' && go=true
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "web=$web go=$go"

  # Skipped on push (the build job runs its own frontend build) and on a
  # pull request that changes nothing under web/. A skipped job satisfies
  # the required check; a changes job that never ran or failed leaves the
  # output empty, which runs this job.
  frontend-checks:
    needs: [changes]
    if: |
      !cancelled() &&
      github.event_name != 'push' &&
      needs.changes.outputs.web != 'false'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the node:26-alpine stage in Dockerfile, so CI tests the
          # runtime the shipped frontend is actually built on. Node 20 is EOL
          # and below the engine floor of size-limit and jest-dom.
          node-version: "26"

      - name: npm ci
        run: npm ci

      - name: npm run lint
        run: npm run lint

      - name: npm run test
        run: npm run test --if-present

      - name: npm run build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high

  govulncheck:
    needs: [changes]
    if: |
      !cancelled() &&
      github.event_name != 'push' &&
      needs.changes.outputs.go != 'false'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The self-hosted runners share one persistent GOMODCACHE and GOCACHE
          # on the host, so the action's cache has nothing to add. Restoring it
          # tar-extracts a ~1.8 GiB blob over those live directories, which
          # corrupts modules when two Go jobs run concurrently, and the save
          # step re-tars ~8 GiB only to lose the key race with the other job.
          cache: false

      - name: Prepare web/dist placeholder for go:embed
        run: mkdir -p web/dist && touch web/dist/.gitkeep

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Fails only on symbol-level findings (your code actually calls the
      # vulnerable symbol) that also have an upstream fix available.
      # Module/package-level findings without a callable trace are noise from
      # transitive deps and don't block CI.
      - name: Run govulncheck (fail only on callable, fixable findings)
        run: |
          set -euo pipefail
          govulncheck -format=json ./... > /tmp/vuln.json 2>&1 || true

          FIXABLE=$(jq -s '[.[] | select(.finding != null
                                          and (.finding.fixed_version // "") != ""
                                          and (.finding.trace | any((.function // "") != "")))] | length' /tmp/vuln.json)

          echo "callable + fixable findings: ${FIXABLE}"

          govulncheck ./... || true

          if [ "${FIXABLE:-0}" -gt 0 ]; then
            echo "::error::Callable, fixable vulnerabilities detected. See output above."
            exit 1
          fi

          echo "No callable, fixable vulnerabilities. Remaining findings are uncalled by this code or have no upstream fix."

  # Hadolint takes under ten seconds; run it as its own job so it costs one
  # runner slot.
  static-checks:
    if: github.event_name != 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  image-scan:
    if: github.event_name != 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Prepare web/dist placeholder for go:embed
        run: mkdir -p web/dist && touch web/dist/.gitkeep

      - name: Build image for scan
        run: docker build -t contextmatrix:scan .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: contextmatrix:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln

      - name: Clean up scan image
        if: always()
        run: docker rmi contextmatrix:scan || true

  build:
    runs-on: self-hosted
    needs: [go-checks, frontend-checks, govulncheck, static-checks, image-scan]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set image tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            BRANCH_SLUG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's|[^a-z0-9._-]|-|g' | cut -c1-50)
            echo "IMAGE_TAG=${BRANCH_SLUG}-${SHORT_SHA}" >> "$GITHUB_ENV"
            echo "PUSH_LATEST=false" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=${SHORT_SHA}" >> "$GITHUB_ENV"
            echo "PUSH_LATEST=true" >> "$GITHUB_ENV"
          fi

      - name: Set version info
        run: |
          echo "BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"
          VERSION=$(git describe --tags --exact-match 2>/dev/null || true)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          TAGS="-t ${{ vars.REGISTRY }}/contextmatrix:${IMAGE_TAG}"
          if [ "${PUSH_LATEST}" = "true" ]; then
            TAGS="${TAGS} -t ${{ vars.REGISTRY }}/contextmatrix:latest"
          fi
          docker build \
            --build-arg VERSION="${VERSION}" \
            --build-arg GIT_COMMIT="${SHORT_SHA}" \
            --build-arg BUILD_TIME="${BUILD_TIME}" \
            ${TAGS} \
            .

      - name: Push image
        run: |
          docker push ${{ vars.REGISTRY }}/contextmatrix:${IMAGE_TAG}
          if [ "${PUSH_LATEST}" = "true" ]; then
            docker push ${{ vars.REGISTRY }}/contextmatrix:latest
          fi

      - name: Clean up
        if: always()
        run: docker image prune -f
