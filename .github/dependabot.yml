# Every contextmatrix repo runs Dependabot at the same day and time, so
# bumps to shared base images and modules land the same night.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "02:00"
      timezone: "Europe/Oslo"
    groups:
      # @size-limit/file pins an exact peer on size-limit, so a split PR pair
      # is unmergeable either way round. Listed first: groups are matched in
      # order, and this one has to win over minor-and-patch.
      size-limit:
        patterns:
          - "size-limit"
          - "@size-limit/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Held at 4.0.2: @uiw pins ~4.0.0, so a newer copy nests and defeats
      # the identity drop. A guard test fails on any bump.
      - dependency-name: "rehype-attr"
        versions: [">4.0.2"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "02:00"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Held at 5.19.2: 5.19.3 writes an empty extensions.objectformat into a
      # format-version-1 .git/config and shell git then rejects it.
      # TestNewManager_AddOriginKeepsConfigReadableByGit fails on any bump.
      - dependency-name: "github.com/go-git/go-git/v5"
        versions: [">5.19.2"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "02:00"
      timezone: "Europe/Oslo"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "02:00"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
