# Every contextmatrix repo runs Dependabot at the same day and time, so
# bumps to shared base images and modules land the same night.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "02:00"
      timezone: "Europe/Oslo"
    groups:
      # @size-limit/file pins an exact peer on size-limit, so a split PR pair
      # is unmergeable either way round. Listed first: groups are matched in
      # order, and this one has to win over minor-and-patch.
      size-limit:
        patterns:
          - "size-limit"
          - "@size-limit/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "02:00"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "02:00"
      timezone: "Europe/Oslo"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "02:00"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
